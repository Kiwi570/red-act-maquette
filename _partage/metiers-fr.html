<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/socle.css"><link rel="stylesheet" href="/assets/css/site.css">
<style>:root{--fond:#F4EEE3;--texte:#1B1916}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--fond);color:var(--texte)}
.carte{display:grid;grid-template-columns:1fr 1fr;width:1200px;height:630px}
.carte-texte{display:flex;flex-direction:column;justify-content:space-between;padding:64px}
.carte-texte img{width:auto;height:84px;align-self:flex-start}
.carte-titre{font-family:var(--police-titres);font-size:66px;line-height:1.02;margin:0;text-wrap:balance;font-weight:600;color:#1B1916}.carte-titre::after{content:'';display:block;width:150px;height:4px;margin-top:22px;background:repeating-linear-gradient(90deg,#E23B2E 0 16px,transparent 16px 24px)}
.carte-nom{font-size:24px;font-weight:600;margin:0;color:#B3261B}
.carte-image{background:center/cover no-repeat}</style>
</head><body>
<div class="carte">
  <div class="carte-texte">
    <img src="/assets/images/logo.png" alt="" style="width:auto;height:84px">
    <p class="carte-titre">Six métiers, une seule plume</p>
    <p class="carte-nom">Red-Act</p>
  </div>
  <div class="carte-image" style="background-image:url('/assets/images/grok/metiers-ouverture-1168.webp')"></div>
</div>
</body></html>
